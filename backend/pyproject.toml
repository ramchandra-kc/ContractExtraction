[project]
name = "contract-extraction-backend"
version = "0.1.0"
description = "ContractExtraction backend: configuration, persistence and (later) pipeline, worker and API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
]

[project.scripts]
contract-extraction = "contract_extraction.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
