[project]
name = "contract-extraction-backend"
version = "0.1.0"
description = "ContractExtraction backend: configuration, persistence and (later) pipeline, worker and API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pymupdf>=1.25",
    "pdf-converter",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "snowballstemmer>=3.1.1",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "lxml>=6.1.3",
]

[project.scripts]
contract-extraction = "contract_extraction.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_extraction"]

[tool.uv.sources]
# PDF -> page JSON (pymupdf / ocr / hybrid), pinned to a tested commit.
pdf-converter = { git = "https://github.com/ramchandra-kc/PdfConverter.git", rev = "6e90fe635c3e8ecf6a2d7ec694622df452e9b826" }
# pdf-converter depends on this pymupdf4llm fork by URL; uv needs it declared here too.
pymupdf4llm = { git = "https://github.com/ramchandra-kc/pymupdf4llm.git", subdirectory = "pymupdf4llm", rev = "fb01d614e38e2280ab95e0969621e940473c99fe" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live and not smoke'"
markers = [
    "live: needs real Ollama and Qdrant (run with CE_LIVE=1 uv run pytest -m live)",
    "ocr: needs Tesseract installed",
    "smoke: end to end against the running dev stack (scripts/dev.sh smoke)",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
