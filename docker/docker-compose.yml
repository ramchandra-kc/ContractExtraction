# Docker services for ContractExtraction: Postgres, Qdrant and (optionally) Ollama.
#
#   docker compose -f docker/docker-compose.yml up -d --build --wait                    # Postgres + Qdrant
#   docker compose -f docker/docker-compose.yml --profile ollama up -d --build --wait   # + local Ollama
#   docker compose -f docker/docker-compose.yml down -v                                 # stop and wipe all data
#
# schema.sql and seed.sql are baked into the Postgres image (Dockerfile) and run only when the volume is
# empty, so after editing them: `down -v`, then `up --build` gives a clean database with the new schema.
# Every value below can be overridden from the environment (e.g. POSTGRES_PORT=55432).
name: contract-extraction

services:
  postgres:
    build: .
    image: contract-extraction-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract}
      POSTGRES_DB: ${POSTGRES_DB:-contract_extraction}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Optional. On macOS prefer native Ollama (Ollama.app, GPU, ~8x faster): it serves the same port, so the
  # database config does not change. Use this container where native Ollama is not available; do not run both.
  # Pull models with: docker compose -f docker/docker-compose.yml exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ollama"]
    environment:
      # One request at a time: Ollama otherwise reserves context memory for 4 parallel requests,
      # and llama3.1:8b with num_ctx 8192 then needs ~11 GiB instead of ~6.5 GiB.
      # Raise it (and Docker's memory limit) to benefit from pipelines with judge_parallel.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  ollama-data:
