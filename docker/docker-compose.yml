# Docker services for ContractExtraction: Postgres, Qdrant and (optionally) Ollama.
#
#   docker compose -f docker/docker-compose.yml up -d --build --wait                    # Postgres + Qdrant
#   docker compose -f docker/docker-compose.yml --profile ollama up -d --build --wait   # + local Ollama
#   docker compose -f docker/docker-compose.yml down -v                                 # stop and wipe all data
#
# schema.sql, seed.sql, seed_catalogue.sql (generated from docs/contract_types_and_fields.md) and seed_presets.sql are baked into the
# Postgres image (Dockerfile) and run only when the volume is empty, so after editing them: `down -v`, then
# `up --build` gives a clean database with the new schema.
# Host ports are 55432 / 56333 rather than the stock 5432 / 6333, so this stack can run beside other projects
# that use the defaults. Every value below can be overridden from the environment (e.g. POSTGRES_PORT=5432).
name: contract-extraction

services:
  postgres:
    build: .
    image: contract-extraction-postgres:local
    container_name: contract-extraction-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contract}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contract}
      POSTGRES_DB: ${POSTGRES_DB:-contract_extraction}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: contract-extraction-qdrant
    ports:
      - "127.0.0.1:${QDRANT_PORT:-56333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Optional. Runs on port 11435 so it can sit next to native Ollama (Ollama.app, 11434, GPU, ~8x faster on macOS).
  # Point the provider at it with:
  #   contract-extraction providers set ollama-local --base-url http://localhost:11435
  # Pull models with: docker compose -f docker/docker-compose.yml exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:0.5.4
    container_name: contract-extraction-ollama
    profiles: ["ollama"]
    environment:
      # One request at a time: Ollama otherwise reserves context memory for 4 parallel requests,
      # and llama3.1:8b with num_ctx 8192 then needs ~11 GiB instead of ~6.5 GiB.
      # Raise it (and Docker's memory limit) to benefit from pipelines with judge_parallel.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  ollama-data:
